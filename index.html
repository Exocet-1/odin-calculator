<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="titlebar">
      <img src="images/icon.png">
      <h1>Calculator</h1>
    </div>
    <input class="display" value="0">
    <div class="keypad">
      <div class="row">
        <button id="clear">C</button>
        <button class="parens" disabled>(</button>
        <button class="parens" disabled>)</button>
        <button class="operator">/</button>
      </div>
      <div class="row">
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">x</button>
      </div>
      <div class="row">
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">-</button>
      </div>
      <div class="row">
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">+</button>
      </div>
      <div class="row">
        <button id="zero">0</button>
        <button id="decimal">.</button>
        <button id="equal">=</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
